<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#102b57"><title>Dugital</title>
    <link rel="stylesheet" href="style.css">
    <style id="dugital-caption-bold-toolbar">
      .dugital-format-toolbar { display: flex; align-items: center; gap: 8px; margin: 9px 0; }
      .dugital-format-toolbar button {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 38px; min-height: 36px; padding: 5px 12px;
        border: 1px solid rgba(91, 146, 229, .42); border-radius: 9px;
        background: rgba(36, 86, 170, .13); color: inherit;
        font: inherit; font-weight: 800; cursor: pointer;
      }
      .dugital-format-toolbar button:hover,
      .dugital-format-toolbar button:focus-visible {
        border-color: #478aea; background: rgba(55, 116, 207, .25);
      }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body class="app-body">
    <div class="page-loader is-visible" id="dugital-loader" role="status" aria-live="polite" aria-label="Loading Dugital">
      <div class="loader-inner">
        <div class="loader-emblem"><img src="news.PNG" alt=""><span class="orbit orbit-a"></span><span class="orbit orbit-b"></span>
        </div><strong>Dugital</strong><span class="loader-caption" id="loader-caption">Loading your stories...</span><span class="loading-progress"></span>
      </div>
    </div>
    <div class="app-container">
      <header class="app-header" id="main-header"><a class="header-brand" href="home.html"><img src="news.PNG" alt="News logo"><span><b>Dugital</b><small>STORIES THAT MATTER</small></span></a>
        <div class="header-right"><span class="header-label">Create post</span><button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="site-nav"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        </div>
      </header>
      <nav class="bottom-nav" id="site-nav" aria-label="Main navigation"><a href="home.html" class="nav-item "><i class="fa-solid fa-house"></i><span>Home</span></a><a href="liked.html" class="nav-item "><i class="fa-solid fa-heart"></i><span>Liked</span></a><a href="upload.html" class="nav-item active"><i class="fa-solid fa-square-plus"></i><span>Create post</span></a><a href="profile.html" class="nav-item "><i class="fa-solid fa-user"></i><span>Profile</span></a>
      </nav>
      <main class="main-content">
        <section class="page-hero">
          <div><span class="eyebrow">CREATE / PUBLISH</span>
            <h1>Create a story</h1>
            <p>Make something worth sharing with your community.</p>
          </div>
        </section>
        <section class="editor-shell glass-card">
          <div class="editor-title"><span class="editor-icon"><i class="fa-solid fa-pen-nib"></i></span>
            <div>
              <h2>New post</h2>
              <p>What's on your mind today?</p>
            </div>
          </div>
          <div class="upload-area"><label for="post-desc">Your caption</label>
            <div class="dugital-format-toolbar" role="toolbar" aria-label="Caption formatting">
              <button id="post-desc-bold-btn" type="button" title="Bold selected text (Ctrl+B / Cmd+B)" aria-label="Bold selected text"><strong>B</strong></button>
            </div>
            <div class="upload-flex-container"><textarea id="post-desc" placeholder="Tell your story..." dir="auto"></textarea>
              <div id="preview-container" class="preview-container hidden"></div>
            </div>
            <div class="file-action">
              <h3>Add media</h3>
              <p>Choose a format to attach your files.</p><input type="file" id="post-file" accept="image/*" multiple hidden>
              <div class="upload-options"><button class="upload-type-btn color-img active" data-type="image"><i class="fa-solid fa-images"></i> Photo</button><button class="upload-type-btn color-vid" data-type="video"><i class="fa-solid fa-video"></i> Video</button><button class="upload-type-btn color-reel" data-type="reel"><i class="fa-solid fa-clapperboard"></i> Reel</button>
              </div>
            </div><button id="publish-btn" class="primary-btn publish-icon-btn"><i class="fa-solid fa-paper-plane"></i> Publish story</button>
          </div>
        </section>
      </main>
    </div>
    <script src="ui.js" defer></script>
    <script type="module" src="app.js"></script>
  </body>
</html>

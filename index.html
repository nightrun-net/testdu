
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#102b57"><title>Dugital</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body class="auth-body"><canvas id="auth-canvas" aria-hidden="true"></canvas>
    <div class="auth-haze" aria-hidden="true"></div>
    <div class="page-loader" id="dugital-loader" role="status" aria-live="polite" aria-label="Loading Dugital">
      <div class="loader-inner">
        <div class="loader-emblem"><img src="news.PNG" alt=""><span class="orbit orbit-a"></span><span class="orbit orbit-b"></span>
        </div><strong>Dugital</strong><span class="loader-caption" id="loader-caption">Connecting to Dugital...</span><span class="loading-progress"></span>
      </div>
    </div>
    <main class="auth-container">
      <section class="auth-intro">
        <div class="eyebrow"><i class="fa-solid fa-bolt"></i> THE NEXT GENERATION OF NEWS</div>
        <h1>Stories that<br><em>move you.</em>
        </h1>
        <p>Discover the latest updates, share moments, and stay connected to the stories that matter.</p>
        <div class="auth-feature"><i class="fa-solid fa-globe"></i> Real stories. Real connections. One place.</div>
      </section>
      <section class="auth-box glass-card"><img src="news.PNG" alt="Dugital News" class="brand-logo-img"><span class="eyebrow">WELCOME BACK</span>
        <h2>Sign in to Dugital</h2>
        <p>Enter your details to continue your journey.</p><label for="email">Email address</label>
        <div class="input-wrap"><i class="fa-regular fa-envelope"></i><input type="email" id="email" placeholder="test@gmail.com" autocomplete="email">
        </div><label for="password">Password</label>
        <div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" id="password" placeholder="********" autocomplete="current-password">
        </div>
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAFox0a1ud_9D_51v" data-theme="dark"></div>
        <button id="login-btn" class="primary-btn">Sign In <i class="fa-solid fa-arrow-right"></i></button>
        <p id="auth-error" class="error-msg" role="alert"></p>
      </section>
    </main>
    <script src="canvas-bg.js" defer></script>
    <script src="ui.js" defer></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script type="module" src="app.js"></script>
  </body>
</html>

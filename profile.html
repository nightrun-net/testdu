<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Du Test</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container glass-bg">
        <header class="app-header" id="main-header">
            <h2>Profile</h2>
        </header>

        <main class="main-content">
            <div class="profile-header-card glass-card">
                <div class="profile-avatar-wrapper">
                    
                    <label for="profile-upload">
                        <img id="profile-img-preview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="profile-avatar">
                    </label>
                    <input type="file" id="profile-upload" accept="image/*" hidden>
                    <div id="upload-spinner" class="spinner-overlay hidden"><i class="fa-solid fa-spinner fa-spin"></i></div>
                </div>
                
                <h3 id="profile-name-display" class="user-display-name">Loading...</h3>
                
                <div class="stats-row">
                    <div class="stat-box">
                        <span id="user-post-count" class="stat-num">0</span>
                        <span class="stat-label">Posts</span>
                    </div>
                </div>

                <button id="logout-btn" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</button>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i></a>
            <a href="liked.html" class="nav-item"><i class="fa-solid fa-heart"></i></a>
            <a href="upload.html" class="nav-item"><i class="fa-solid fa-square-plus"></i></a>
            <a href="profile.html" class="nav-item active"><i class="fa-solid fa-user"></i></a>
        </nav>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
